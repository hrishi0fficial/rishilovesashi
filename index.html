<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Are You Sure You Wanna Marry Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Fredoka", "Comic Sans MS", "Trebuchet MS", sans-serif;
      text-align: center;
      margin: 0;
      padding-top: 80px;
      min-height: 100vh;
      box-sizing: border-box;
      background: linear-gradient(to right, #ff8a8a 0%, #ffb7c5 30%, #ffb7c5 70%, #ff8a8a 100%);
      overflow: hidden;
    }
    .frame {
      position: fixed;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      border: 6px double #c2185b;
      border-radius: 40px;
      pointer-events: none;
      z-index: 0;
    }
    h1 {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 700;
      color: #d81b60;
      text-shadow: 3px 3px 0 #ffffff;
      letter-spacing: 1px;
      margin: 0 30px 20px;
    }
    button {
      font-family: inherit;
      font-weight: 700;
      font-size: 22px;
      padding: 12px 36px;
      margin: 10px;
      border: none;
      border-radius: 50px;
      color: white;
      cursor: pointer;
    }
    .yes { background-color: red; }
    .no { background-color: gray; }
    /* Shake animation for the No button */
    .shake {
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    /* ---------- SHUT UP screen ---------- */
    #shoutWrap {
      display: none;
      position: fixed;
      top: 34px; left: 34px; right: 34px; bottom: 34px;
      z-index: 1;
    }
    #shout {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      font-weight: 700;
      font-size: clamp(26px, 5vw, 44px);
      line-height: 1.1;
      color: #d81b60;
      text-align: left;
    }
    #shout .ch {
      display: inline-block;
      animation: pop 0.18s ease-out;
    }
    #shout .sp { width: 0.5em; }
    @keyframes pop {
      0%   { transform: scale(0); opacity: 0; }
      70%  { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(1); }
    }
    #yesNote {
      display: none;
      margin: 14px 0 0;
      text-align: center;
      font-weight: 700;
      font-size: clamp(16px, 3.8vw, 24px);
      color: #a0224f;
    }
    #wideBtn {
      display: none;
      width: 100%;
      margin: 8px 0 0;
      background-color: red;
    }
    /* ---------- New page (slides in from the right) ---------- */
    #page2 {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 4;
      background: linear-gradient(to right, #ff8a8a 0%, #ffb7c5 30%, #ffb7c5 70%, #ff8a8a 100%);
      overflow: hidden;
    }
    #page2 .frame2 {
      position: absolute;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      border: 6px double #c2185b;
      border-radius: 40px;
      pointer-events: none;
    }
    /* ---------- Marriage certificate ---------- */
    .certWrap {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 24px;
      overflow-y: auto;
    }
    .cert {
      box-sizing: border-box;
      width: min(520px, 100%);
      margin: auto;
      padding: 22px 20px 20px;
      text-align: center;
      background: #fff8ef;
      border: 5px double #c2185b;
      border-radius: 26px;
      box-shadow: 0 8px 24px rgba(194, 24, 91, 0.25);
    }
    .certHearts { font-size: 22px; }
    .certTitle {
      margin: 4px 0 8px;
      font-size: clamp(26px, 6vw, 38px);
      font-weight: 700;
      color: #d81b60;
    }
    .certSmall {
      margin: 6px 0;
      font-size: clamp(14px, 3.4vw, 18px);
      font-weight: 700;
      color: #a64a68;
    }
    .certNames {
      margin: 8px 0;
      font-size: clamp(30px, 8vw, 46px);
      font-weight: 700;
      color: #d81b60;
    }
    .heart { display: inline-block; animation: beat 1.2s ease-in-out infinite; }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }
    .thumb {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 14px auto 6px;
      padding: 14px;
      display: block;
      border: 3px solid #c2185b;
      border-radius: 50%;
      background: #ffe3ec;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .thumb svg { width: 100%; height: 100%; }
    .thumb:active { transform: scale(0.92); }
    .thumb.scan { animation: ring 0.9s ease-out; }
    @keyframes ring {
      0%   { box-shadow: 0 0 0 0 rgba(216, 27, 96, 0.55); background: #ffc2d4; }
      100% { box-shadow: 0 0 0 28px rgba(216, 27, 96, 0); background: #ffe3ec; }
    }
    .thumbText {
      margin: 0;
      font-size: clamp(14px, 3.4vw, 18px);
      font-weight: 700;
      color: #a64a68;
    }
    .floatHeart {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      font-size: 22px;
    }
    /* ---------- Certificate image ---------- */
    .certImgWrap { flex-direction: column; }
    .certImg {
      display: block;
      margin: auto auto 0;
      max-width: 100%;
      max-height: calc(100vh - 190px);
      max-height: calc(100dvh - 190px);
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(194, 24, 91, 0.3);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #marriedText {
      display: none;
      margin: 14px auto auto;
      max-width: 640px;
      text-align: center;
      font-weight: 700;
      font-size: clamp(18px, 4vw, 28px);
      line-height: 1.3;
      color: #d81b60;
    }
    /* ---------- Phone friendly ---------- */
    html { -webkit-text-size-adjust: 100%; }
    button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .certWrap { -webkit-overflow-scrolling: touch; }
    @media (max-width: 600px) {
      body { padding-top: 56px; }
      .frame, #page2 .frame2 {
        border-width: 4px;
        border-radius: 24px;
      }
      h1 { margin: 0 18px 14px; }
      button { font-size: 19px; padding: 11px 30px; }
      #shoutWrap { top: 22px; left: 22px; right: 22px; bottom: 22px; }
      .certWrap { padding: 16px 12px; }
    }
    .character {
      display: block;
      width: 220px;
      max-width: 60%;
      margin: 10px auto 0;
      pointer-events: none;
    }
    @media (max-width: 600px) {
      .character { width: 180px; }
    }
  </style>
</head>

    let attempts = 0;
    let lastCount = 0;
    let burst = false;

    function moveButton(e) {
      e.preventDefault();
      if (burst) return;

      // count one attempt at a time (a tap fires touch + click together)
      const now = Date.now();
      if (now - lastCount > 500) {
        attempts++;
        lastCount = now;
      }

      // more than three attempts: burst!
      if (attempts > 3) {
        explode();
        return;
      }

      noBtn.style.position = "fixed";
      const maxX = window.innerWidth - noBtn.offsetWidth;
      const maxY = window.innerHeight - noBtn.offsetHeight;
      noBtn.style.left = Math.random() * maxX + "px";
      noBtn.style.top = Math.random() * maxY + "px";

      // sad picture
      character.src = sadPic;

      // restart the shake animation
      noBtn.classList.remove("shake");
      void noBtn.offsetWidth;
      noBtn.classList.add("shake");
    }

    function explode() {
      burst = true;
      const rect = noBtn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      // tiny round gray particles
      for (let i = 0; i < 40; i++) {
        const p = document.createElement("div");
        const size = 4 + Math.random() * 6;
        p.style.cssText =
          "position:fixed;border-radius:50%;pointer-events:none;z-index:10;" +
          "width:" + size + "px;height:" + size + "px;" +
          "left:" + (cx - size / 2) + "px;top:" + (cy - size / 2) + "px;" +
          "background:hsl(0,0%," + (35 + Math.random() * 40) + "%);";
        document.body.appendChild(p);

        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 160;
        p.animate(
          [
            { transform: "translate(0,0) scale(1)", opacity: 1 },
            { transform: "translate(" + Math.cos(angle) * dist + "px," + Math.sin(angle) * dist + "px) scale(0.3)", opacity: 0 }
          ],
          { duration: 700 + Math.random() * 500, easing: "ease-out" }
        ).onfinish = () => p.remove();
      }

      // the No button bursts away
      noBtn.style.display = "none";

      // mild screen shake
      document.body.animate(
        [
          { transform: "translate(0,0)" },
          { transform: "translate(-4px,3px)" },
          { transform: "translate(4px,-3px)" },
          { transform: "translate(-3px,-3px)" },
          { transform: "translate(3px,3px)" },
          { transform: "translate(0,0)" }
        ],
        { duration: 500, iterations: 2 }
      );

      // happy blushing picture
      character.src = blushPic;
    }

    // Yes pressed: clear everything, keep the same background
    document.getElementById("yesBtn").addEventListener("click", function () {
      burst = true;
      document.querySelectorAll("h1, #yesBtn, #noBtn, .character").forEach(function (el) {
        el.style.display = "none";
      });
      setTimeout(startShout, 600);
    });

    // SHUT UP text: letters pop in one by one and fill the screen down to the bottom
    function startShout() {
      const wrap = document.getElementById("shoutWrap");
      const shout = document.getElementById("shout");
      const wideBtn = document.getElementById("wideBtn");
      wrap.style.display = "block";

      const text = "SSSSSSSSHHHHHHHUUUUUUUUTTTTTTT UPPPPPPPPPPPP";
      let i = 0;

      const timer = setInterval(function () {
        // stop when the text reaches the bottom, then show the wide button
        const lineH = parseFloat(getComputedStyle(shout).fontSize) * 1.1;
        const limit = window.innerHeight - 34 - 90 - 40 - lineH;
        if (shout.getBoundingClientRect().bottom > limit || i > 4000) {
          clearInterval(timer);
          // exclamation mark after the last P
          const bang = document.createElement("span");
          bang.className = "ch";
          bang.textContent = "!";
          shout.appendChild(bang);
          document.getElementById("yesNote").style.display = "block";
          wideBtn.style.display = "block";
          return;
        }

        // after the text ends, the last P keeps going to the end of the screen
        const c = i < text.length ? text[i] : "P";
        const span = document.createElement("span");
        span.className = c === " " ? "sp" : "ch";
        span.textContent = c === " " ? "" : c;
        shout.appendChild(span);
        i++;
      }, 25);
    }

    // Normal slide: current screen leaves to the left, next screen comes in from the right
    function slideTo(fromEl, toEl) {
      toEl.style.display = "block";
      const opts = { duration: 700, easing: "ease-in-out", fill: "forwards" };
      fromEl.animate(
        [{ transform: "translateX(0)" }, { transform: "translateX(-100%)" }], opts);
      toEl.animate(
        [{ transform: "translateX(100%)" }, { transform: "translateX(0)" }], opts);
    }

    // Arrow pressed: slide to the certificate page
    let toPage2 = false;
    document.getElementById("wideBtn").addEventListener("click", function () {
      if (toPage2) return;
      toPage2 = true;
      slideTo(document.getElementById("shoutWrap"), document.getElementById("page2"));
    });

    // Certificate pressed: it pops, hearts float up and the text appears
    const certImg = document.getElementById("certImg");
    const marriedText = document.getElementById("marriedText");
    let certPresses = 0;
    certImg.addEventListener("click", function (e) {
      certPresses++;
      certImg.animate(
        [
          { transform: "scale(1)" },
          { transform: "scale(1.08)" },
          { transform: "scale(0.96)" },
          { transform: "scale(1)" }
        ],
        { duration: 450, easing: "ease-out" }
      );

      if (marriedText.style.display !== "block") {
        marriedText.style.display = "block";
        marriedText.animate(
          [
            { transform: "scale(0)", opacity: 0 },
            { transform: "scale(1.2)", opacity: 1 },
            { transform: "scale(1)", opacity: 1 }
          ],
          { duration: 500, easing: "ease-out" }
        );
      }

      for (let i = 0; i < 8; i++) {
        const h = document.createElement("span");
        h.className = "floatHeart";
        h.textContent = ["❤️", "💖", "💕"][i % 3];
        h.style.left = (e.clientX - 11 + (Math.random() - 0.5) * 80) + "px";
        h.style.top = (e.clientY - 11) + "px";
        document.body.appendChild(h);
        h.animate(
          [
            { transform: "translateY(0) scale(0.6)", opacity: 1 },
            { transform: "translateY(" + (-90 - Math.random() * 90) + "px) scale(1.2)", opacity: 0 }
          ],
          { duration: 1100 + Math.random() * 600, easing: "ease-out" }
        ).onfinish = function () { h.remove(); };
      }

      // 5th press: go back to the very first screen
      if (certPresses === 5) {
        setTimeout(function () {
          document.getElementById("page2").animate(
            [{ transform: "translateX(0)" }, { transform: "translateX(100%)" }],
            { duration: 600, easing: "ease-in-out", fill: "forwards" }
          ).onfinish = function () { location.reload(); };
        }, 700);
      }
    });

    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("touchstart", moveButton);
    noBtn.addEventListener("click", moveButton);
  </script>
</body>
</html>
